<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Steve AI</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="chat.css"></head>
<body>
<header>
  <span id="dot"></span>
  <select id="client" title="Chọn trợ lý AI" aria-label="Trợ lý AI"></select>
  <span id="state">Đang mở…</span>
  <button id="new" class="ic" title="Phiên mới" aria-label="Phiên mới">✚</button>
  <button id="more" class="ic" title="Tuỳ chọn" aria-label="Tuỳ chọn">⋯</button>
</header>
<main id="term"></main>
<footer>
  <button id="add" class="ic" title="Skill và câu gợi ý" aria-label="Skill và câu gợi ý">＋</button>
  <textarea id="box" rows="1" placeholder="Nhập yêu cầu…" title="Enter gửi, Shift+Enter xuống dòng. Ô trống: ↑ ↓ Enter Esc và số 1–9 để trả lời khi AI hỏi."></textarea>
  <button id="send" class="ic pri" title="Gửi (Enter)" aria-label="Gửi">➤</button>
</footer>
<div id="pop" hidden></div>
<script src="vendor/xterm.js"></script><script src="vendor/addon-fit.js"></script><script src="chat.js"></script><script src="panels.js"></script><script src="ui.js"></script><script src="boot.js"></script>
</body></html>
